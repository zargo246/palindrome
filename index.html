<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Palindrome Checker</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <main>
        <h1>Palindrome Checker</h1>

        <p>
            Enter a word or phrase to see if it is a palindrome.
        </p>

        <input id="userInput" type="text" placeholder="Enter a word or phrase">

        <button id="checkButton">Check</button>

        <h2 id="result"></h2>
    </main>

    <script src="/js/main.js"></script>
</body>

</html>
